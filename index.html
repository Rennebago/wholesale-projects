<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wholesale Projects</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #181818;
      background: #f3f3f3;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 3rem 1rem;
    }
    h1 { margin: 0 0 .25rem; font-size: 1.75rem; }
    p.sub { margin: 0 0 2rem; color: #5c5c5c; }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .75rem; }
    a.card {
      display: block;
      padding: 1rem 1.25rem;
      background: #fff;
      border: 1px solid #dddbda;
      border-radius: .5rem;
      color: inherit;
      text-decoration: none;
    }
    a.card:hover, a.card:focus-visible { border-color: #0176d3; }
    a.card strong { display: block; color: #0176d3; }
    a.card span { color: #5c5c5c; font-size: .875rem; }
  </style>
</head>
<body>
  <main>
    <h1>Wholesale Projects</h1>
    <p class="sub">Prototype previews.</p>
    <ul>
      <li>
        <a class="card" href="credit-insights/">
          <strong>Credit Insights</strong>
          <span>Credit report insights MVP prototype</span>
        </a>
      </li>
      <li>
        <a class="card" href="new-test/">
          <strong>New Test</strong>
          <span>Placeholder test project</span>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
